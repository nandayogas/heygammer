<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEONBLAST — Breakout Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:#04060b;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; font-family:'Press Start 2P', monospace; overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  #stage {
    position:relative;
    width:min(94vw, calc((100svh - 58px) * 0.6667), 520px);
    aspect-ratio:480/720;
    border:1px solid #14243a;
    touch-action:none;
  }
  canvas { width:100%; height:100%; display:block; cursor:crosshair; }

  /* ---- Overlay (menu / jeda / game over) ---- */
  #overlay {
    position:absolute; inset:0; z-index:4;
    display:flex; align-items:center; justify-content:center;
    background:rgba(4,7,13,0.9); text-align:center;
  }
  #overlay.hide { display:none; }
  .panel { display:flex; flex-direction:column; align-items:center; gap:20px; padding:24px; max-width:92%; }
  .panel[hidden] { display:none; }
  .title { font-size:26px; color:#eaf6ff; letter-spacing:2px; }
  .title span { color:#35e0ff; }
  .sub { font-size:9px; color:#7f93b3; letter-spacing:5px; }
  .big-red { font-size:20px; color:#ff5470; letter-spacing:2px; }
  .big-cyan { font-size:16px; color:#35e0ff; }
  .scoreline { font-size:10px; color:#eaf6ff; line-height:2.2; }
  .scoreline b { color:#ffd23f; font-weight:normal; }
  .cta {
    font-family:inherit; font-size:12px; padding:16px 26px;
    background:#0b1520; color:#35e0ff; border:2px solid #35e0ff;
    cursor:pointer; transition:background .12s, color .12s, transform .06s;
  }
  .cta:hover { background:#35e0ff; color:#05070d; }
  .cta:active { transform:translateY(2px); }
  .cta.alt { color:#9fb2cc; border-color:#3a4d68; }
  .cta.alt:hover { background:#3a4d68; color:#eaf6ff; }
  .keys { font-size:7px; color:#64789a; line-height:2.4; letter-spacing:1px; }
  .legend { font-size:7px; color:#8fa5c5; display:flex; flex-wrap:wrap; gap:10px 14px; justify-content:center; max-width:360px; line-height:2; }
  .legend .cap {
    display:inline-block; font-size:8px; padding:5px 6px 4px; border-radius:4px;
    background:var(--c); color:#05070d; margin-right:5px;
  }

  /* ---- Tombol ikon di pojok ---- */
  #sysbtns { position:absolute; top:10px; right:10px; z-index:5; display:flex; gap:8px; }
  #sysbtns button {
    width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    background:rgba(9,15,25,0.8); border:1px solid #1f2c3f; color:#bfefff;
    cursor:pointer; padding:0;
  }
  #sysbtns button:hover { border-color:#35e0ff; color:#fff; }
  #sysbtns svg { width:18px; height:18px; }
  #sysbtns .hide, .hide { display:none !important; }

  #hint { font-size:8px; color:#5d7291; letter-spacing:1px; text-align:center; line-height:1.8; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="game" width="480" height="720"></canvas>

  <!-- Tombol sistem -->
  <div id="sysbtns">
    <button id="btnMute" title="Suara">
      <svg id="icOn" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M16 8a5 5 0 0 1 0 8" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
      <svg id="icOff" viewBox="0 0 24 24" class="hide"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button id="btnPause" title="Jeda" class="hide">
      <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" fill="currentColor"/><rect x="14" y="5" width="4" height="14" fill="currentColor"/></svg>
    </button>
  </div>

  <!-- Overlay -->
  <div id="overlay">
    <div class="panel" id="ovMenu">
      <div>
        <div class="title">NEON<span>BLAST</span></div>
        <div class="sub" style="margin-top:14px">BREAKOUT &middot; ARCADE</div>
      </div>
      <div class="legend">
        <span><i class="cap" style="--c:#38ff9c">W</i>PEMBERAT</span>
        <span><i class="cap" style="--c:#ff4fa3">M</i>MULTIBOLA</span>
        <span><i class="cap" style="--c:#35e0ff">S</i>LAMBAT</span>
        <span><i class="cap" style="--c:#ff7a1a">F</i>TEMbus</span>
        <span><i class="cap" style="--c:#ff5470">+</i>NYAWA</span>
      </div>
      <button class="cta" id="btnStart">MULAI MAIN</button>
      <div class="keys">MOUSE / SENTUH &mdash; GERAK<br>SPASI / KETUK &mdash; LEPAS BOLA<br>P / ESC &mdash; JEDA</div>
    </div>

    <div class="panel" id="ovPause" hidden>
      <div class="big-cyan">JEDA</div>
      <div class="scoreline">SKOR <b id="pScore">000000</b></div>
      <button class="cta" id="btnResume">LANJUT</button>
      <button class="cta alt" id="btnRestart">ULANG DARI AWAL</button>
    </div>

    <div class="panel" id="ovOver" hidden>
      <div class="big-red">GAME OVER</div>
      <div class="scoreline">SKOR <b id="finScore">000000</b><br>TERBAIK <b id="finBest">000000</b></div>
      <button class="cta" id="btnAgain">MAIN LAGI</button>
    </div>
  </div>
</div>

<p id="hint">GERAKKAN PADDLE &middot; HANCURKAN SEMUA BALOK &middot; JANGAN BIARKAN BOLA JATUH</p>

<script>
'use strict';
/* =====================================================
   NEONBLAST — breakout arcade dalam satu file
   ===================================================== */

/* ---------- Konstanta & util ---------- */
const W = 480, H = 720;
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
cvs.width = W * DPR; cvs.height = H * DPR;
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

const rand  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pad   = (n, l = 6) => String(Math.floor(n)).padStart(l, '0');
const easeOut = t => 1 - Math.pow(1 - t, 3);
function rr(c, x, y, w, h, r) { // rounded rect (kompatibel luas)
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ---------- Audio sintetis (tanpa file eksternal) ---------- */
let AC = null, noiseBuf = null;
let muted = localStorage.getItem('nb_mute') === '1';

function ac() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const len = AC.sampleRate * 0.3;
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f0, f1, dur, type = 'square', vol = 0.12, delay = 0) {
  if (muted) return;
  const a = ac(), t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(Math.max(1, f0), t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1 || f0), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function hiss(dur = 0.15, vol = 0.1, delay = 0) {
  if (muted) return;
  const a = ac(), t = a.currentTime + delay;
  const s = a.createBufferSource(); s.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 900;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(a.destination);
  s.start(t); s.stop(t + dur + 0.05);
}
const SFX = {
  paddle() { tone(180, 340, 0.07, 'square', 0.11); },
  wall()   { tone(720, 690, 0.03, 'square', 0.045); },
  hit(t)   { tone(460 + t * 140, 460 + t * 140, 0.05, 'square', 0.08); },
  brk()    { tone(900, 240, 0.14, 'sawtooth', 0.1); hiss(0.08, 0.08); },
  power()  { [523, 659, 784].forEach((f, i) => tone(f, f, 0.09, 'square', 0.1, i * 0.07)); },
  launch() { tone(220, 720, 0.16, 'square', 0.1); },
  lose()   { tone(320, 55, 0.5, 'sawtooth', 0.16); hiss(0.25, 0.12); },
  level()  { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.12, 'square', 0.1, i * 0.09)); },
  over()   { tone(420, 70, 0.9, 'sawtooth', 0.16); hiss(0.5, 0.1); },
};
function unlockAudio() { try { ac(); } catch (e) {} }

/* ---------- State game ---------- */
let state = 'menu';            // menu | play | over
let paused = false;
let phase = 'run';             // run | clear (transisi antar level)
let clearT = 0, clearBonus = 0;
let score = 0, lives = 3, level = 1;
let best = +(localStorage.getItem('nb_best') || 0);
let combo = 0, comboScale = 0;
let shake = 0, flashRed = 0, levelSpawnT = 9;
const timers = { wide: 0, slow: 0, fire: 0 };

const paddle = { x: W / 2, y: H - 64, w: 92, tw: 92, h: 14, squash: 0 };
let balls = [], bricks = [], pops = [], parts = [], floats = [];

/* Latar: bintang jatuh pelan */
const stars = Array.from({ length: 55 }, () => ({
  x: rand(0, W), y: rand(0, H), s: rand(1, 2.2), v: rand(5, 20), a: rand(0.1, 0.4)
}));

/* Pola scanline CRT (dibuat sekali) */
const scanCvs = document.createElement('canvas');
scanCvs.width = 2; scanCvs.height = 3;
const sctx = scanCvs.getContext('2d');
sctx.fillStyle = 'rgba(0,0,0,0.16)'; sctx.fillRect(0, 2, 2, 1);
const scanPat = ctx.createPattern(scanCvs, 'repeat');

/* ---------- Balok & level ---------- */
const COLS = 13, BH = 20, GAP = 5, MX = 12, TOP = 76;
const BW = (W - MX * 2 - (COLS - 1) * GAP) / COLS;
const TIER_COLOR = { 1: '#35e0ff', 2: '#ff4fa3', 3: '#b46bff', 4: '#e8f2ff' };

function patternOn(p, r, c, rows) {
  const ctr = (COLS - 1) / 2, cr = (rows - 1) / 2;
  switch (p) {
    case 0: return true;
    case 1: return (r + c) % 2 === 0;
    case 2: return Math.abs(c - ctr) <= 1 + (rows - 1 - r) * (ctr / Math.max(1, rows - 1));
    case 3: return Math.abs(c - ctr) + Math.abs(r - cr) <= cr + 1.4;
    case 4: return Math.abs(c - (ctr + Math.sin(r * 0.9) * 3.2)) < 2.8;
    case 5: return r === 0 || r === rows - 1 || c === 0 || c === COLS - 1 || (r % 3 === 1 && c % 3 === 1);
  }
  return true;
}

function buildLevel(n) {
  bricks = [];
  const rows = Math.min(10, 6 + ((n - 1) >> 1));
  const p = (n - 1) % 6;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < COLS; c++) {
      if (!patternOn(p, r, c, rows)) continue;
      if (Math.random() < 0.06) continue;              // sedikit lubang biar organik
      const depth = rows > 1 ? r / (rows - 1) : 0;
      let hp = depth < 0.34 ? 3 : depth < 0.67 ? 2 : 1;
      if (n >= 3 && depth < 0.6 && Math.random() < 0.22) hp = Math.min(4, hp + 1); // armor
      bricks.push({
        x: MX + c * (BW + GAP), y: TOP + r * (BH + GAP),
        w: BW - GAP, h: BH - GAP,
        hp, maxHp: hp, flash: 0, alive: true,
        delay: r * 0.05 + c * 0.012
      });
    }
  }
  levelSpawnT = 0;
}

/* ---------- Bola ---------- */
const ballBase = () => Math.min(540, 315 + (level - 1) * 20);

function spawnBall() {
  balls = [{ x: paddle.x, y: paddle.y - 9, dx: 0, dy: -1, speed: ballBase(), stuck: true, trail: [] }];
}
function launchAll() {
  let did = false;
  for (const b of balls) {
    if (b.stuck) {
      b.stuck = false;
      const a = rand(-0.5, 0.5);
      b.dx = Math.sin(a); b.dy = -Math.cos(a);
      did = true;
    }
  }
  if (did) SFX.launch();
}
function splitBalls() {
  const moving = balls.filter(b => !b.stuck);
  const out = [];
  for (const b of moving) {
    for (const da of [-0.45, 0, 0.45]) {
      const cs = Math.cos(da), sn = Math.sin(da);
      out.push({
        x: b.x, y: b.y,
        dx: b.dx * cs - b.dy * sn, dy: b.dx * sn + b.dy * cs,
        speed: b.speed, stuck: false, trail: []
      });
    }
  }
  balls = out.concat(balls.filter(b => b.stuck));
  if (balls.length > 12) balls = balls.slice(0, 12);
}

/* ---------- Power-up ---------- */
const POP_TYPES = [
  { t: 'W', name: 'PEMBERAT!', c: '#38ff9c', wgt: 26 },
  { t: 'M', name: 'MULTIBOLA!', c: '#ff4fa3', wgt: 22 },
  { t: 'S', name: 'LAMBAT!', c: '#35e0ff', wgt: 20 },
  { t: 'F', name: 'TEMBUS!', c: '#ff7a1a', wgt: 20 },
  { t: '+', name: '+1 NYAWA!', c: '#ff5470', wgt: 12 },
];
const POP_TOTAL = POP_TYPES.reduce((s, p) => s + p.wgt, 0);

function maybeDrop(x, y) {
  if (Math.random() >= 0.12) return;
  let roll = Math.random() * POP_TOTAL, type = POP_TYPES[0];
  for (const p of POP_TYPES) { roll -= p.wgt; if (roll <= 0) { type = p; break; } }
  pops.push({ x, y, vy: 120, ph: rand(0, 6), type });
}
function applyPop(p) {
  switch (p.type.t) {
    case 'W': timers.wide = 10; paddle.tw = 140; break;
    case 'M': splitBalls(); break;
    case 'S': timers.slow = 8; break;
    case 'F': timers.fire = 8; break;
    case '+': lives = Math.min(5, lives + 1); break;
  }
  floats.push({ x: paddle.x, y: paddle.y - 24, txt: p.type.name, life: 0.9, max: 0.9, c: p.type.c });
  burst(p.x, p.y, p.type.c, 8);
  SFX.power();
}

/* ---------- Efek ---------- */
function addShake(v) { shake = Math.min(1.2, shake + v); }
function burst(x, y, c, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(60, 320), L = rand(0.35, 0.8);
    parts.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
      life: L, max: L, sz: rand(2, 5),
      rot: rand(0, 6.3), vr: rand(-8, 8), c, dot: Math.random() < 0.3
    });
  }
}
function spark(x, y, c, n = 4) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(30, 130), L = rand(0.15, 0.35);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: L, max: L, sz: rand(1.5, 3), rot: 0, vr: 0, c, dot: true });
  }
}

/* ---------- Hancurkan balok ---------- */
function destroyBrick(b, byFire) {
  if (byFire) b.hp = 1;
  b.flash = 1;
  b.hp--;
  if (b.hp <= 0) {
    b.alive = false;
    combo++; comboScale = 1;
    const mult = 1 + Math.min(combo, 30) * 0.05;
    const pts = Math.round(40 * b.maxHp * mult);
    score += pts; if (score > best) best = score;
    floats.push({ x: b.x + b.w / 2, y: b.y, txt: '+' + pts, life: 0.8, max: 0.8, c: '#ffffff' });
    burst(b.x + b.w / 2, b.y + b.h / 2, TIER_COLOR[b.maxHp], 14);
    maybeDrop(b.x + b.w / 2, b.y + b.h / 2);
    SFX.brk(); addShake(0.12);
    if (phase === 'run' && !bricks.some(k => k.alive)) {
      phase = 'clear'; clearT = 2.4;
      clearBonus = 400 + lives * 150;
      score += clearBonus; if (score > best) best = score;
      pops.length = 0;
      SFX.level();
    }
  } else {
    score += 10;
    spark(b.x + b.w / 2, b.y + b.h / 2, TIER_COLOR[b.hp], 4);
    SFX.hit(b.hp);
  }
}

/* ---------- Alur permainan ---------- */
function loseLife() {
  lives--; combo = 0;
  timers.wide = 0; timers.slow = 0; timers.fire = 0; paddle.tw = 92;
  flashRed = 1; addShake(0.8); SFX.lose();
  if (lives <= 0) gameOver();
  else spawnBall();
}
function gameOver() {
  state = 'over';
  localStorage.setItem('nb_best', String(best));
  document.getElementById('finScore').textContent = pad(score);
  document.getElementById('finBest').textContent = pad(best);
  setOverlay('ovOver');
  SFX.over();
}
function startGame() {
  score = 0; lives = 3; level = 1; combo = 0;
  parts = []; floats = []; pops = [];
  timers.wide = 0; timers.slow = 0; timers.fire = 0;
  paddle.x = W / 2; paddle.tw = 92; paddle.w = 92;
  flashRed = 0; shake = 0;
  buildLevel(1); spawnBall();
  phase = 'run'; state = 'play'; paused = false;
  setOverlay(null);
  tone(660, 990, 0.15, 'square', 0.1);
}
function nextLevel() {
  level++;
  buildLevel(level); spawnBall();
  pops = []; phase = 'run';
}

/* ---------- Update ---------- */
function update(dt) {
  // timer power-up
  if (timers.wide > 0) { timers.wide -= dt; if (timers.wide <= 0) { timers.wide = 0; paddle.tw = 92; } }
  if (timers.slow > 0) timers.slow = Math.max(0, timers.slow - dt);
  if (timers.fire > 0) timers.fire = Math.max(0, timers.fire - dt);

  // paddle
  if (keys.l !== keys.r) {
    paddle.x += (keys.r ? 1 : -1) * 470 * dt;
    pointerX = paddle.x;
  } else if (pointerX !== null) {
    paddle.x = pointerX;
  }
  paddle.x = clamp(paddle.x, paddle.w / 2 + 4, W - paddle.w / 2 - 4);
  paddle.w += (paddle.tw - paddle.w) * Math.min(1, dt * 8);
  paddle.squash = Math.max(0, paddle.squash - dt * 5);

  // animasi kemunculan balok
  levelSpawnT = Math.min(2, levelSpawnT + dt * 1.2);

  // bola (dengan sub-step anti tembus)
  const effMul = timers.slow > 0 ? 0.62 : 1;
  for (let bi = balls.length - 1; bi >= 0; bi--) {
    const b = balls[bi];
    if (b.stuck) { b.x = paddle.x; b.y = paddle.y - 9; b.trail.length = 0; continue; }
    const eff = b.speed * effMul;
    let remain = eff * dt;
    while (remain > 0) {
      const d = Math.min(6, remain); remain -= d;
      b.x += b.dx * d; b.y += b.dy * d;

      // tembok
      if (b.x < 7)        { b.x = 7;     b.dx = Math.abs(b.dx);  SFX.wall(); spark(b.x, b.y, '#35e0ff', 3); }
      else if (b.x > W-7) { b.x = W - 7; b.dx = -Math.abs(b.dx); SFX.wall(); spark(b.x, b.y, '#35e0ff', 3); }
      if (b.y < 50)       { b.y = 50;    b.dy = Math.abs(b.dy);  SFX.wall(); spark(b.x, b.y, '#35e0ff', 3); }

      // paddle
      if (b.dy > 0 && b.y + 7 >= paddle.y && b.y + 7 <= paddle.y + paddle.h + 10 &&
          Math.abs(b.x - paddle.x) <= paddle.w / 2 + 7) {
        b.y = paddle.y - 7;
        const rel = clamp((b.x - paddle.x) / (paddle.w / 2), -1, 1);
        const ang = rel * 1.05;
        b.dx = Math.sin(ang); b.dy = -Math.cos(ang);
        combo = 0; paddle.squash = 1;
        SFX.paddle(); spark(b.x, paddle.y, '#ffffff', 5);
      }

      // balok
      for (const k of bricks) {
        if (!k.alive) continue;
        const cx = clamp(b.x, k.x, k.x + k.w), cy = clamp(b.y, k.y, k.y + k.h);
        const ddx = b.x - cx, ddy = b.y - cy;
        if (ddx * ddx + ddy * ddy <= 49) {
          if (timers.fire > 0) { destroyBrick(k, true); continue; }  // tembus!
          if (Math.abs(ddx) > Math.abs(ddy)) {
            b.dx = (ddx >= 0 ? 1 : -1) * Math.abs(b.dx);
            b.x = cx + (ddx >= 0 ? 7 : -7);
          } else {
            b.dy = (ddy >= 0 ? 1 : -1) * Math.abs(b.dy);
            b.y = cy + (ddy >= 0 ? 7 : -7);
          }
          destroyBrick(k, false);
          break;
        }
      }

      // cegah sudut terlalu datar
      if (Math.abs(b.dy) < 0.18) {
        b.dy = (b.dy < 0 ? -1 : 1) * 0.18;
        const m = Math.hypot(b.dx, b.dy);
        b.dx /= m; b.dy /= m;
      }
    }
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 10) b.trail.shift();
    if (b.y - 7 > H + 20) balls.splice(bi, 1);
  }
  if (phase === 'run' && balls.length === 0) loseLife();

  // power-up jatuh
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i];
    p.ph += dt * 3;
    p.y += p.vy * dt;
    p.x += Math.sin(p.ph) * 24 * dt;
    if (p.y + 10 >= paddle.y && p.y - 10 <= paddle.y + paddle.h + 6 &&
        Math.abs(p.x - paddle.x) < paddle.w / 2 + 16) {
      applyPop(p); pops.splice(i, 1);
    } else if (p.y > H + 30) pops.splice(i, 1);
  }

  // transisi level selesai
  if (phase === 'clear') {
    clearT -= dt;
    if (clearT <= 0) nextLevel();
  }

  // partikel, teks melayang, flash, guncangan
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vy += 380 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += p.vr * dt; p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.y -= 28 * dt; f.life -= dt;
    if (f.life <= 0) floats.splice(i, 1);
  }
  for (const k of bricks) if (k.flash > 0) k.flash = Math.max(0, k.flash - dt * 6);
  flashRed = Math.max(0, flashRed - dt * 2);
  shake = Math.max(0, shake - dt * 2.2);
  comboScale = Math.max(0, comboScale - dt * 4);
}

/* ---------- Render ---------- */
function drawHeart(x, y, s, c) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.moveTo(0, 0.35);
  ctx.bezierCurveTo(-0.55, -0.1, -0.4, -0.55, 0, -0.2);
  ctx.bezierCurveTo(0.4, -0.55, 0.55, -0.1, 0, 0.35);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function render(t) {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 14, (Math.random() - 0.5) * shake * 14);

  // latar
  ctx.fillStyle = '#05070d';
  ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.strokeStyle = 'rgba(110,160,255,0.05)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 48; x < W; x += 48) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
  for (let y = 48; y < H; y += 48) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
  ctx.stroke();
  for (const s of stars) {
    ctx.fillStyle = 'rgba(180,220,255,' + s.a + ')';
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }

  // balok
  for (const k of bricks) {
    if (!k.alive) continue;
    const pr = levelSpawnT >= 2 ? 1 : clamp((levelSpawnT - k.delay) / 0.35, 0, 1);
    if (pr <= 0) continue;
    const oy = (1 - easeOut(pr)) * -26;
    ctx.globalAlpha = pr;
    ctx.fillStyle = TIER_COLOR[k.hp];
    ctx.fillRect(k.x, k.y + oy, k.w, k.h);
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.fillRect(k.x, k.y + oy, k.w, 3);
    if (k.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + k.flash + ')';
      ctx.fillRect(k.x, k.y + oy, k.w, k.h);
    }
    ctx.globalAlpha = 1;
  }

  // power-up
  for (const p of pops) {
    ctx.shadowColor = p.type.c; ctx.shadowBlur = 10;
    ctx.fillStyle = '#0b1420';
    rr(ctx, p.x - 17, p.y - 9, 34, 18, 6); ctx.fill();
    ctx.strokeStyle = p.type.c; ctx.lineWidth = 2;
    rr(ctx, p.x - 17, p.y - 9, 34, 18, 6); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.font = '9px "Press Start 2P", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.type.t, p.x, p.y + 1);
  }

  // paddle (dengan efek squash)
  ctx.save();
  ctx.translate(paddle.x, paddle.y + paddle.h / 2);
  ctx.scale(1 + paddle.squash * 0.1, 1 - paddle.squash * 0.4);
  ctx.shadowColor = '#35e0ff'; ctx.shadowBlur = 12;
  ctx.fillStyle = '#0c1e30';
  rr(ctx, -paddle.w / 2, -paddle.h / 2, paddle.w, paddle.h, 7); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#35e0ff'; ctx.lineWidth = 2;
  rr(ctx, -paddle.w / 2, -paddle.h / 2, paddle.w, paddle.h, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(53,224,255,0.9)';
  ctx.fillRect(-paddle.w / 2 + 5, -2, paddle.w - 10, 4);
  ctx.restore();

  // bola + jejak
  const fireOn = timers.fire > 0;
  const bcol = fireOn ? '#ff7a1a' : '#35e0ff';
  for (const b of balls) {
    const n = b.trail.length;
    for (let i = 0; i < n; i++) {
      const q = b.trail[i], f = (i + 1) / n;
      ctx.globalAlpha = f * 0.3;
      ctx.fillStyle = bcol;
      ctx.beginPath(); ctx.arc(q.x, q.y, 7 * f * 0.8, 0, 6.3); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (b.stuck) { // garis bidik saat bola menempel
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(b.x, b.y - 12); ctx.lineTo(b.x, b.y - 34); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.shadowColor = bcol; ctx.shadowBlur = 14;
    ctx.fillStyle = bcol;
    ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, 6.3); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, 6.3); ctx.fill();
  }

  // partikel
  for (const p of parts) {
    const a = p.life / p.max;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.c;
    if (p.dot) {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.sz * a, 0, 6.3); ctx.fill();
    } else {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.sz, -p.sz * 0.4, p.sz * 2, p.sz * 0.8);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;

  // teks skor melayang
  ctx.font = '9px "Press Start 2P", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  for (const f of floats) {
    ctx.globalAlpha = clamp(f.life / f.max, 0, 1);
    ctx.fillStyle = f.c;
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // HUD
  if (state !== 'menu') {
    ctx.font = '10px "Press Start 2P", monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#dff3ff';
    ctx.fillText('SKOR ' + pad(score), 14, 32);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#9fc0d8';
    ctx.fillText('LV ' + pad(level, 2), W / 2, 32);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#7f93b3';
    ctx.fillText('HI ' + pad(best), W - 70, 32);
    for (let i = 0; i < lives; i++) drawHeart(W - 18 - i * 17, 27, 11, '#ff5470');

    if (state === 'play') {
      // chip timer power-up aktif
      let cx = 14;
      ctx.textAlign = 'left';
      const chip = (txt, c) => { ctx.fillStyle = c; ctx.fillText(txt, cx, 64); cx += ctx.measureText(txt).width + 12; };
      if (timers.fire > 0) chip('TEMBUS ' + Math.ceil(timers.fire) + 's', '#ff7a1a');
      if (timers.slow > 0) chip('LAMBAT ' + Math.ceil(timers.slow) + 's', '#35e0ff');
      if (timers.wide > 0) chip('LEBAR ' + Math.ceil(timers.wide) + 's', '#38ff9c');

      // combo
      if (combo >= 3) {
        ctx.textAlign = 'center';
        ctx.globalAlpha = 0.55 + comboScale * 0.45;
        ctx.fillStyle = '#ffd23f';
        ctx.font = (10 + comboScale * 4) + 'px "Press Start 2P", monospace';
        ctx.fillText('COMBO x' + (1 + Math.min(combo, 30) * 0.05).toFixed(1), W / 2, 64);
        ctx.globalAlpha = 1;
        ctx.font = '10px "Press Start 2P", monospace';
      }
    }
  }

  // banner level selesai
  if (state === 'play' && phase === 'clear') {
    const a = 0.75 + 0.25 * Math.sin(t * 6);
    ctx.textAlign = 'center';
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffd23f';
    ctx.font = '16px "Press Start 2P", monospace';
    ctx.fillText('LEVEL ' + level + ' SELESAI!', W / 2, H / 2 - 28);
    ctx.fillStyle = '#38ff9c';
    ctx.font = '10px "Press Start 2P", monospace';
    ctx.fillText('+' + clearBonus + ' BONUS', W / 2, H / 2 + 2);
    ctx.globalAlpha = 1;
  }

  // kilat merah saat kehilangan nyawa
  if (flashRed > 0) {
    ctx.fillStyle = 'rgba(255,70,90,' + flashRed * 0.22 + ')';
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }

  ctx.restore();

  // scanline CRT di atas segalanya (statis, ikut layar)
  ctx.fillStyle = scanPat;
  ctx.fillRect(0, 0, W, H);
}

/* ---------- Input ---------- */
const keys = { l: false, r: false };
let pointerX = null;
const stage = document.getElementById('stage');

window.addEventListener('pointermove', e => {
  const r = stage.getBoundingClientRect();
  pointerX = clamp((e.clientX - r.left) / r.width * W, 0, W);
});
stage.addEventListener('pointerdown', e => {
  unlockAudio();
  const r = stage.getBoundingClientRect();
  pointerX = clamp((e.clientX - r.left) / r.width * W, 0, W);
  if (state === 'play' && !paused) launchAll();
});
window.addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  unlockAudio();
  if (e.code === 'ArrowLeft')  keys.l = true;
  if (e.code === 'ArrowRight') keys.r = true;
  if (e.code === 'Space') {
    if (state === 'menu' || state === 'over') startGame();
    else if (state === 'play' && !paused) launchAll();
  }
  if (e.code === 'Enter' && state !== 'play') startGame();
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') togglePause();
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft')  keys.l = false;
  if (e.code === 'ArrowRight') keys.r = false;
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play' && !paused) togglePause();
});

/* ---------- Overlay & tombol ---------- */
const overlay = document.getElementById('overlay');
const btnPause = document.getElementById('btnPause');

function setOverlay(id) {
  ['ovMenu', 'ovPause', 'ovOver'].forEach(x => document.getElementById(x).hidden = true);
  btnPause.classList.toggle('hide', state !== 'play');
  if (!id) { overlay.classList.add('hide'); return; }
  overlay.classList.remove('hide');
  document.getElementById(id).hidden = false;
}
function togglePause() {
  if (state !== 'play') return;
  paused = !paused;
  if (paused) document.getElementById('pScore').textContent = pad(score);
  setOverlay(paused ? 'ovPause' : null);
}
document.getElementById('btnStart').addEventListener('click', () => { unlockAudio(); startGame(); });
document.getElementById('btnAgain').addEventListener('click', () => { unlockAudio(); startGame(); });
document.getElementById('btnResume').addEventListener('click', togglePause);
document.getElementById('btnRestart').addEventListener('click', () => { paused = false; startGame(); });
btnPause.addEventListener('click', togglePause);

const icOn = document.getElementById('icOn'), icOff = document.getElementById('icOff');
function syncMuteIcon() {
  icOn.classList.toggle('hide', muted);
  icOff.classList.toggle('hide', !muted);
}
document.getElementById('btnMute').addEventListener('click', () => {
  muted = !muted;
  localStorage.setItem('nb_mute', muted ? '1' : '0');
  syncMuteIcon();
  if (!muted) tone(660, 660, 0.08, 'square', 0.1);
});
syncMuteIcon();

/* ---------- Loop utama ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  // bintang latar selalu bergerak agar menu tetap hidup
  for (const s of stars) { s.y += s.v * dt; if (s.y > H + 2) { s.y = -2; s.x = rand(0, W); } }
  if (state === 'play' && !paused) update(dt);
  render(now / 1000);
  requestAnimationFrame(frame);
}

/* ---------- Init ---------- */
document.fonts && document.fonts.load('10px "Press Start 2P"');
buildLevel(1);          // level 1 tampak samar di belakang menu
levelSpawnT = 9;        // langsung tampil penuh
setOverlay('ovMenu');
requestAnimationFrame(frame);
</script>
